<section class="hero">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-8 text-center">

                <span class="hero-badge">

                    📚 KnowledgeHub

                </span>

                <h1 class="hero-title">

                    Discover.
                    Learn.
                    Share.

                </h1>

                <p class="hero-subtitle">

                    A modern knowledge-sharing platform where students,
                    developers and creators publish useful articles.

                </p>

                <form
                    action="{% url 'search' %}"
                    class="hero-search mt-5">

                    <div class="input-group">

                        <span class="input-group-text">

                            <i class="bi bi-search"></i>

                        </span>

                        <input
                            class="form-control"
                            name="q"
                            placeholder="Search Python, Django, AI...">

                        <button class="btn btn-primary">

                            Search

                        </button>

                    </div>

                </form>

                {% if user.is_authenticated %}

                <div class="mt-4">

                    <a
                        href="{% url 'create' %}"
                        class="btn btn-primary btn-lg">

                        <i class="bi bi-plus-circle"></i>

                        Create Article

                    </a>

                </div>

                {% endif %}

            </div>

        </div>

    </div>

</section>
